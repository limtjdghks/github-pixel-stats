name: Refresh GitHub pixel stats

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Detect persisted state
        id: state-branch
        shell: bash
        run: |
          set +e
          git ls-remote --exit-code --heads origin refs/heads/stats-state >/dev/null 2>&1
          status=$?
          set -e

          case "$status" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unable to inspect stats-state (git exit $status)" >&2; exit "$status" ;;
          esac

      - name: Checkout persisted state
        if: steps.state-branch.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          ref: stats-state
          path: .state

      - name: Prepare collector state
        shell: bash
        env:
          STATE_BRANCH_EXISTS: ${{ steps.state-branch.outputs.exists }}
        run: |
          if [[ "$STATE_BRANCH_EXISTS" == "true" && ! -f .state/state.json ]]; then
            echo "stats-state exists but state.json is missing" >&2
            exit 1
          fi
          mkdir -p .state build dist

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Generate cards and next state
        run: npm run generate -- --state .state/state.json --next-state build/next-state.json --out dist
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Validate generated output
        run: npm run validate:output -- --state build/next-state.json --out dist

      - name: Upload next state
        uses: actions/upload-artifact@v7
        with:
          name: next-state
          path: build/next-state.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: [collect, persist-state]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  persist-state:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: state-repository

      - name: Download next state
        uses: actions/download-artifact@v8
        with:
          name: next-state
          path: next-state

      - name: Persist collector state
        shell: bash
        working-directory: state-repository
        run: |
          set +e
          git ls-remote --exit-code --heads origin refs/heads/stats-state >/dev/null 2>&1
          status=$?
          set -e

          if [[ "$status" == "0" ]]; then
            git fetch origin stats-state
            git checkout -B stats-state origin/stats-state
          elif [[ "$status" == "2" ]]; then
            git checkout --orphan stats-state
            git rm -rf .
          else
            echo "Unable to inspect stats-state (git exit $status)" >&2
            exit "$status"
          fi

          if [[ -f state.json ]] && cmp -s state.json ../next-state/next-state.json; then
            echo "Collector state is unchanged"
            exit 0
          fi

          cp ../next-state/next-state.json state.json
          git add state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 통계 상태 갱신"
          git push origin HEAD:stats-state
